
services:
  db:
    image: postgres:15-alpine
    container_name: smart_lost_found_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: smart_lost_found
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_lost_found_backend
    environment:
      # Use your actual Supabase DB connection instead of the local db container
      - ConnectionStrings__SupabaseDb=Host=aws-1-eu-central-1.pooler.supabase.com;Database=postgres;Username=postgres.pkokemlpjntdehmeyvvt;Password=sjRG5X2cRzWlqzK9;SSL Mode=Require;Trust Server Certificate=true
      - Jwt__Key=THIS_IS_A_SUPER_SECRET_KEY_FOR_SMART_LOST_AND_FOUND_PROJECT_2026
    ports:
      - "5192:8080"
    depends_on:
      - db
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: smart_lost_found_admin
    ports:
      - "3000:80" # Maps localhost:3000 to the Nginx port 80
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
